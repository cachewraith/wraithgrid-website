<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wraithgrid: Claude Code, Gemini and Antigravity side by side</title>
    <meta
      name="description"
      content="Run many Claude Code, Gemini CLI and Antigravity sessions side by side, each with its own account and project folder. A free, open-source desktop app for Windows, macOS and Linux."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wraithgrid" />
    <meta
      property="og:title"
      content="Wraithgrid: Claude Code, Gemini and Antigravity side by side"
    />
    <meta
      property="og:description"
      content="Run many Claude Code, Gemini CLI and Antigravity sessions side by side, each with its own account and project folder."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%screenshots/grid-dark.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta
      property="og:image:alt"
      content="Wraithgrid window with four agent panes in a 2×2 grid, each signed in to its own account"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Wraithgrid: Claude Code, Gemini and Antigravity side by side"
    />
    <meta
      name="twitter:description"
      content="Run many Claude Code, Gemini CLI and Antigravity sessions side by side, each with its own account and project folder."
    />
    <meta name="twitter:image" content="%SITE_URL%screenshots/grid-dark.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Wraithgrid",
        "description": "Run many Claude Code, Gemini CLI and Antigravity sessions side by side, each with its own account and project folder.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "license": "https://opensource.org/licenses/MIT",
        "url": "%SITE_URL%",
        "downloadUrl": "https://github.com/cachewraith/wraithgrid/releases/latest",
        "codeRepository": "https://github.com/cachewraith/wraithgrid",
        "screenshot": "%SITE_URL%screenshots/grid-dark.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Sets data-theme and preloads the matching hero image before first paint. -->
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript">
        Wraithgrid runs many Claude Code, Gemini CLI and Antigravity sessions side by side, each
        with its own account and project folder.
        <a href="https://github.com/cachewraith/wraithgrid/releases/latest">Download it on GitHub</a
        >.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
